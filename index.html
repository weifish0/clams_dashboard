<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiverGuard | 人工蛤蜊水質監測網</title>
    <meta name="description" content="Dashboard for Artificial Clam Water Quality Monitoring Network">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-water"></i>
            <h1>RiverGuard <span style="font-weight: 300; font-size: 1.2rem; color: var(--text-secondary);">| 人工蛤蜊監測儀表板</span></h1>
        </div>
        <div class="nav-controls">
            <button class="btn btn-danger btn-sm" onclick="simulatePollution('factory-a')">工廠 A</button>
            <button class="btn btn-danger btn-sm" onclick="simulatePollution('factory-b')">工廠 B</button>
            <button class="btn btn-danger btn-sm" onclick="simulatePollution('factory-c')">工廠 C</button>
            <button class="btn btn-danger btn-sm" onclick="simulatePollution('factory-d')">工廠 D</button>
            <button class="btn btn-sm" style="background: rgba(88, 166, 255, 0.1); color: var(--accent-blue);" onclick="resetSystem()"><i class="fa-solid fa-rotate-right"></i></button>
            <div class="system-status" id="sys-status" style="margin-left: 1rem;">
                <div class="status-dot"></div>
                <span id="sys-status-text">系統監控中</span>
            </div>
        </div>
    </header>

    <main>
        <!-- 地圖背景層 -->
        <div class="map-container">
            <!-- 水質數據橫幅 -->
            <div class="metrics-banner glass-panel">
                <div style="display: flex; align-items: center; padding-right: 1.2rem; border-right: 1px solid var(--border-color); margin-right: 1.2rem;">
                    <h2 style="margin: 0; font-size: 0.95rem; white-space: nowrap;"><i class="fa-solid fa-chart-line"></i> 實時水質數據</h2>
                </div>
                
                <div class="metric-row">
                    <div class="metric-item">
                        <div class="metric-name"><i class="fa-solid fa-clapperboard"></i> 閉合率</div>
                        <div><span id="val-closure" class="metric-value">--</span> <span class="metric-unit">%</span></div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-name"><i class="fa-solid fa-flask"></i> 酸鹼度 (pH)</div>
                        <div><span id="val-ph" class="metric-value">--</span> <span class="metric-unit">pH</span></div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-name"><i class="fa-solid fa-droplet"></i> 溶氧量 (DO)</div>
                        <div><span id="val-do" class="metric-value">--</span> <span class="metric-unit">mg/L</span></div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-name"><i class="fa-solid fa-bolt"></i> 導電度 (EC)</div>
                        <div><span id="val-ec" class="metric-value">--</span> <span class="metric-unit">μS/cm</span></div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-name"><i class="fa-solid fa-water"></i> 濁度</div>
                        <div><span id="val-turb" class="metric-value">--</span> <span class="metric-unit">NTU</span></div>
                    </div>
                </div>
            </div>
            <!-- 模擬河流 SVG (已在CSS隱藏，僅作保留) -->
                <svg class="river-path" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <path d="M 10,0 C 20,30 10,60 50,80 C 80,90 90,100 90,100" fill="none" stroke="rgba(88, 166, 255, 0.15)" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 80,0 C 70,20 80,40 50,80" fill="none" stroke="rgba(88, 166, 255, 0.15)" stroke-width="3" stroke-linecap="round"/>
                </svg>

                <!-- 節點 A -->
                <div class="node factory" id="factory-a" title="工廠 A">
                    <div class="node-icon"><i class="fa-solid fa-industry"></i></div>
                    <div class="node-label">工廠 A</div>
                </div>
                <div class="node clam" id="clam-1" title="人工蛤蜊 01">
                    <div class="heatmap-zone"></div>
                    <div class="node-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <div class="node-label">蛤蜊 01</div>
                </div>

                <!-- 節點 B -->
                <div class="node factory" id="factory-b" title="工廠 B">
                    <div class="node-icon"><i class="fa-solid fa-industry"></i></div>
                    <div class="node-label">工廠 B</div>
                </div>
                <div class="node clam" id="clam-2" title="人工蛤蜊 02">
                    <div class="heatmap-zone"></div>
                    <div class="node-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <div class="node-label">蛤蜊 02</div>
                </div>

                <!-- 節點 C -->
                <div class="node factory" id="factory-c" title="工廠 C">
                    <div class="node-icon"><i class="fa-solid fa-industry"></i></div>
                    <div class="node-label">工廠 C</div>
                </div>
                <div class="node clam" id="clam-3" title="人工蛤蜊 03">
                    <div class="heatmap-zone"></div>
                    <div class="node-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <div class="node-label">蛤蜊 03</div>
                </div>

                <!-- 節點 D -->
                <div class="node factory" id="factory-d" title="工廠 D">
                    <div class="node-icon"><i class="fa-solid fa-industry"></i></div>
                    <div class="node-label">工廠 D</div>
                </div>
                <div class="node clam" id="clam-4" title="人工蛤蜊 04">
                    <div class="heatmap-zone"></div>
                    <div class="node-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <div class="node-label">蛤蜊 04 (出海口)</div>
                </div>
            </div>
        </div>
    </main>

    <!-- 浮動日誌 (Toast) 容器 -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
